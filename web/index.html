<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Recorder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🎙️ Voice Recorder</h1>
      <p class="subtitle">Record, save, and manage your voice notes — right in the browser.</p>
    </header>

    <!-- Permission / error banner -->
    <div id="errorBanner" class="banner banner--error" hidden></div>

    <main class="recorder-card">
      <div class="status-row">
        <span id="statusDot" class="status-dot status-dot--idle"></span>
        <span id="statusText" class="status-text">Idle</span>
        <span id="timer" class="timer">00:00</span>
      </div>

      <canvas id="visualizer" class="visualizer" height="80"></canvas>

      <div class="controls">
        <button id="recordBtn" class="record-btn" aria-label="Start recording" title="Start/stop recording (Spacebar)">
          <span class="record-btn__icon"></span>
        </button>
        <button id="pauseBtn" class="control-btn" disabled aria-label="Pause recording">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
      </div>

      <p class="hint">Press <kbd>Space</kbd> to start/stop recording</p>
    </main>

    <section class="recordings-section">
      <h2>Your Recordings</h2>
      <div id="emptyState" class="empty-state">No recordings yet. Hit the red button to make your first one!</div>
      <ul id="recordingsList" class="recordings-list"></ul>
    </section>
  </div>

  <template id="recordingTemplate">
    <li class="recording-item">
      <div class="recording-item__top">
        <button class="play-btn" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" hidden><path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <div class="recording-item__meta">
          <input class="recording-name" type="text" value="Recording" />
          <div class="recording-sub">
            <span class="recording-date"></span>
            <span class="dot-sep">•</span>
            <span class="recording-duration">00:00</span>
          </div>
        </div>
      </div>
      <input class="seek-bar" type="range" min="0" max="100" value="0" step="0.1" />
      <audio class="audio-el" preload="metadata"></audio>
      <div class="recording-item__actions">
        <button class="icon-action notes-toggle" title="Add/view notes">📝 Notes</button>
        <button class="icon-action download-webm" title="Download as .webm">⭳ WEBM</button>
        <button class="icon-action download-wav" title="Download as .wav">⭳ WAV</button>
        <button class="icon-action delete-btn" title="Delete recording">🗑 Delete</button>
      </div>
      <div class="notes-section" hidden>
        <ul class="notes-list" hidden></ul>
        <textarea class="notes-input" placeholder="Type notes, one per line — each line becomes a bullet" hidden></textarea>
      </div>
    </li>
  </template>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
